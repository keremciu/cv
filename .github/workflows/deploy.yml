name: Build & Release CV

on:
  push:
    branches: [ gh-pages ]

jobs:
  build-pdf:
    runs-on: ubuntu-22.04
    env:
      DISPLAY: :0

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y xvfb xfonts-75dpi xfonts-base
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-3.jammy_amd64.deb

      - name: Start Xvfb
        run: sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &

      - name: Install pdfkit
        run: gem install pdfkit

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Generate PDF
        run: ruby make_pdf.rb

      - name: Set release tag
        id: tag
        run: echo "value=v$(date +%s)" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: ./_site/cv.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
